name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The WP1 suite proves CHECK constraints, composite FKs, cascade
      # behaviour and concurrent uniqueness. A mock cannot, so CI runs the real
      # engine on every push (PLAN gate 2).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkwellio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkwellio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, 2026-07-20
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the secret scan can inspect every commit.
          fetch-depth: 0

      - name: Set up pnpm
        # pnpm/action-setup v6.1.1, 2026-11-03; version comes from packageManager.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Set up Node.js
        # actions/setup-node v7.1.0, 2026-10-08
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkwellio
          REQUIRE_DB: "1"
        run: pnpm check

      - name: Audit production dependencies
        # Dev-only tooling is excluded: its advisories cannot reach production,
        # and eslint-config-next currently pins an unpatched transitive copy.
        run: pnpm audit --prod --audit-level=high

      - name: Scan for secrets
        env:
          # Pinned binary, checksum verified. The gitleaks action scans a commit
          # range, which fails on a branch's first push and misses earlier
          # commits in a multi-commit push.
          GITLEAKS_VERSION: "8.27.2"
          GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip --file "/tmp/${archive}" \
            --directory "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --redact --exit-code=1

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    # Non-blocking activation: runs when lighthouserc.json is committed
    if: hashFiles('lighthouserc.json') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm --filter @inkwellio/web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkwellio

      - name: Run Lighthouse CI (non-blocking measurement)
        continue-on-error: true
        run: pnpm dlx @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

