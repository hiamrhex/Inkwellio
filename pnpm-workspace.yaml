packages:
  - "apps/*"
  - "packages/*"

# Shared dependency versions. Every workspace package references these with
# "catalog:" so a version is changed in exactly one place.
catalog:
  "@tailwindcss/turbopack": "4.3.4"
  "@types/node": "24.19.2"
  "@types/pg": "8.23.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "dependency-cruiser": "18.7.2"
  "drizzle-kit": "0.31.11"
  "drizzle-orm": "0.45.4"
  "better-auth": "1.7.15"
  "@better-auth/drizzle-adapter": "1.7.15"
  "eslint": "9.39.5"
  "eslint-config-next": "16.4.5"
  "next": "16.4.5"
  "parse5": "7.2.1"
  "pg": "8.23.1"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "react-markdown": "9.0.1"
  "rehype-raw": "7.0.0"
  "tailwindcss": "4.3.4"
  "typescript": "5.9.3"
  "vite": "8.3.5"
  "vitest": "5.1.0"
  "zod": "4.6.7"

# Refuse to install any package published less than 14 days ago (minutes).
# This encodes the brief's version rule for transitive dependencies too.
minimumReleaseAge: 20160

# Windows without Developer Mode cannot create symlinks; a hoisted layout keeps
# pnpm working on this machine and in CI without elevation.
nodeLinker: hoisted

# Windows policy on this machine denies symlink creation. Workspace packages
# are still projects in the workspace; they are simply not hoisted into the
# root node_modules as symlinks.
hoistWorkspacePackages: false

# Postinstall scripts are denied unless explicitly allowed. esbuild's install
# script is denied deliberately: drizzle-kit's bundled esbuild works from the
# platform package alone, which is proven by the U-1 run under
# --ignore-scripts (E-028), and a denied script is one fewer arbitrary
# executable in the build.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
